name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/

      - name: Build
        run: dotnet build src/ --configuration Release --no-restore

      - name: Test
        run: dotnet test src/ArchAudit.Tests/ArchAudit.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/ArchAudit.Cli/ArchAudit.Cli.csproj --configuration Release --no-build --output ./nupkg

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg
          retention-days: 5
